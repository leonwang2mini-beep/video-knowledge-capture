current_milestone:
  id: "M9"
  name: "wechat-sidecar-local-only"
  display_name: "微信捕获组件本机专用与免重复弹窗"
  status: "technical-closure"
  started_at: "2026-08-26"
  completed_at: "2026-08-26"
  release_candidate: "1.3.3"
  objective: "让 Hermes 多次调用桌面微信捕获备用路线时复用同一受管可执行文件身份，并在不开放局域网入站的前提下消除 Windows 防火墙重复授权提示。"
  success_definition:
    - "patched wx_channel 每次都从固定受管路径启动，任务配置和下载数据仍按 run_id 隔离。"
    - "只清理 P0004 受管目录和 P0004 临时目录对应的 wx_channel 历史防火墙规则，不触碰无关应用规则。"
    - "原始运行时和受管副本各有且仅有一条 Inbound、Block、Profile Any 规则，不关闭 Windows 防火墙，也不允许公用或专用网络入站。"
    - "防火墙配置可只读检查并可精确撤销；Hermes 和 Web 继续复用同一本机下载核心。"
    - "自动测试使用临时目录且不访问真实 Obsidian；用户下一次真实 Hermes 调用作为不再弹窗的 E4 观察证据。"
  technical_approach:
    executable_identity: "Keep the patched executable at <config>/work/wx-channel-buffer/runtime/wx_channel.exe; keep per-run config and capture data under runs/<run_id>."
    firewall: "Remove only rules whose application paths belong to P0004-managed wx_channel locations, then install two path-scoped inbound block rules for all profiles."
    rollback: "wechat:uninstall-firewall removes only the two named P0004 rules; source runtime and managed media are not deleted."
    validation: "Offline Node tests, PowerShell parser validation, firewall rule read-back, runtime integrity and temporary Inbox/Hermes acceptance."
  acceptance_evidence:
    - id: "m9-stable-executable"
      status: "verified"
      command: "node --test test/wechat-buffer-bridge.test.mjs test/wechat-sidecar.test.mjs test/wechat-firewall.test.mjs"
      result: "18 focused tests passed: consecutive runs share one executable path, retain separate run roots, preserve the verified source runtime, and use argument-array firewall invocation."
    - id: "m9-firewall-migration"
      status: "verified"
      command: "npm.cmd run wechat:configure-firewall && npm.cmd run wechat:firewall-status"
      result: "90 legacy P0004 wx_channel rules were removed and exactly two named rules remain; both are enabled Inbound Block rules for Profile Any."
    - id: "m9-regression-suite"
      status: "verified"
      command: "npm.cmd test && npm.cmd run verify:runtime && npm.cmd run verify:launcher && npm.cmd run verify:usable && npm.cmd run verify:hermes"
      result: "All 93 offline tests passed; pinned runtime integrity, loopback launcher, temporary Inbox workflow and temporary Hermes integration passed without touching a real Obsidian Vault."
    - id: "m9-public-tree-audit"
      status: "verified"
      command: "node scripts/audit-public-release.mjs <temporary Git publish tree>"
      result: "The audit scanned 93 publishable files and passed; the normal workspace command was intentionally not used as evidence because an ignored local out directory contains unrelated generated dependencies."
    - id: "m9-local-deployment"
      status: "verified"
      command: "GET http://127.0.0.1:43127/api/health && hermes gateway status --deep"
      result: "P0004 V1.3.3 is live on 127.0.0.1 and all six Hermes Gateway deep probes passed after exact-sync installation."
    - id: "m9-no-popup-e4"
      status: "pending-user-observation"
      result: "The next user-authorized Hermes WeChat capture must confirm that Windows no longer presents the network-access dialog; automated control of Windows Security prompts is intentionally excluded."


summary: "A Skill-first Windows workflow that captures user-authorized public videos, transcribes them locally, and writes structured Markdown into an explicitly configured Obsidian Inbox."

current_milestone:
  id: "M11"
  name: "external-beta-pilot"
  display_name: "外部 Beta 首装、脱敏反馈与真实宿主验收"
  status: "in-progress"
  started_at: "2026-08-27"
  release_candidate: "1.4.0-beta.1"
  objective: "让首次从 GitHub 获取项目的外部非商业用户，在不泄露本地路径或测试内容的前提下，独立完成首装、诊断、真实采集、Markdown 回读和重复提交确认，并把可复现反馈交给维护者。"
  success_definition:
    - "doctor 提供显式 shareable 模式，脱敏配置目录、用户目录、Hermes Home 和 Inbox 路径，并提醒提交前人工复核。"
    - "公开 Beta 指南使用临时 Inbox，要求真实宿主采集、Markdown 内容回读和重复提交验证，不把成功提示或自动模拟计为 E4。"
    - "GitHub Beta 与 Bug Issue 模板收集版本、宿主、环境、耗时、卡点和已复核诊断，同时禁止链接、凭据、个人路径、媒体和转写内容。"
    - "公共发行门禁覆盖 shareable doctor 回归、Beta 指南、Issue 模板和脱敏审计。"
    - "至少三名外部用户独立完成首装与真实宿主验收，其中至少一名完成真实手机 Hermes 到临时 Inbox 的 E4；OpenClaw 单独保持待验证，直到出现真实使用证据。"
  technical_approach:
    pilot: "Give first-time testers a goal-driven external Beta guide using a disposable config and Inbox while preserving the actual host discovery path."
    diagnostics: "Post-process bounded doctor JSON with explicit local-path redaction; retain actionable statuses and require manual review before sharing."
    feedback: "Use GitHub Issue Forms with structured host and outcome fields plus mandatory privacy and evidence-boundary confirmations."
    validation: "Verify diagnostics and public artifacts locally and in a clean clone; reserve E4 for tester-authored confirmation after file-content readback."
  acceptance_evidence:
    - id: "m11-shareable-doctor"
      status: "verified"
      command: "node --test test/doctor.test.mjs"
      result: "6 focused tests passed, including shareable-mode path redaction, slash variants, actionable status preservation and explicit CLI parsing."
    - id: "m11-beta-feedback-forms"
      status: "verified"
      command: "python -c YAML parse of .github/ISSUE_TEMPLATE/*.yml"
      result: "All 3 Issue Forms parsed successfully; the Beta form records host, environment, install outcome, elapsed time, core task result and mandatory privacy/evidence confirmations."
    - id: "m11-full-release-gates"
      status: "pending-clean-clone"
      result: "Run the full public-release gate from a clean clone after the local M11 commit; ignored promotional artifacts in the maintainer worktree are not public-release inputs."
    - id: "m11-external-user-e4"
      status: "pending-external-users"
      result: "Three external first installs, real host captures with Markdown and duplicate readback, and at least one real phone Hermes flow remain required; no automated run can close this item."


summary: "A Skill-first Windows workflow that captures user-authorized public videos, transcribes them locally, and writes structured Markdown into an explicitly configured Obsidian Inbox."

current_milestone:
  id: "M10"
  name: "community-install-readiness"
  display_name: "社区首装、诊断与多宿主兼容证据"
  status: "in-progress"
  started_at: "2026-08-26"
  release_candidate: "1.4.0-beta.1"
  objective: "让首次从 GitHub 获取项目的非商业用户能按明确宿主完成配置、安装和只读诊断，并让仓库对 Codex、Claude Code、Hermes、OpenClaw 与聊天渠道的兼容声明保持在真实证据范围内。"
  success_definition:
    - "提供显式 Codex、Claude Code、Hermes、OpenClaw 和自定义 Agent Skills 目录安装目标，且只精确同步受管 Skill。"
    - "一条 setup:community 命令可配置已有 Inbox、安装固定版本核心运行时并安装一个明确宿主；重复运行保持幂等。"
    - "doctor 只读检查 Windows、Node.js、Inbox、核心运行时、宿主文件和 loopback 服务，并输出稳定下一步。"
    - "CI 和本地发布门禁覆盖离线测试、临时 Inbox 首用、四宿主隔离首装和公共树脱敏审计。"
    - "README 明确 Skill 不能脱离本地引擎单独工作，QQ/微信等渠道不做未经验证的直接兼容承诺。"
    - "自动化证据最高标记 E3；外部新用户、真实 OpenClaw 和手机消息端到端 E4 保持待验证。"
  technical_approach:
    canonical_skill: "Keep one versioned Skill source under skills/video-knowledge-capture and exact-sync declared files into each supported host root."
    installer: "Require an explicit host and existing writable Inbox; install only pinned core runtime components and managed host files."
    diagnostics: "Return bounded JSON checks and next actions without reading credential values or modifying local state."
    validation: "Use disposable homes, config roots and Inbox directories; inject healthy runtime and loopback responses for offline E3 persona simulation."
  acceptance_evidence:
    - id: "m10-focused-install-tests"
      status: "verified"
      command: "node --test test/agent-skill.test.mjs test/hermes-integration.test.mjs test/community-setup.test.mjs test/doctor.test.mjs"
      result: "14 focused tests passed for exact-sync host installation, setup argument safety, read-only diagnostics and bounded client states."
    - id: "m10-community-persona-simulation"
      status: "verified-e3"
      command: "npm.cmd run verify:community"
      result: "A disposable first-install simulation configured a temporary Inbox, installed Codex, Claude Code, Hermes and OpenClaw integrations, and reached doctor ready using injected healthy runtime and loopback service; no real Vault, account or message channel was used."
    - id: "m10-full-release-gates"
      status: "pending"
      command: "npm.cmd run verify:public-release"
      result: "Pending final clean-tree execution."
    - id: "m10-external-user-e4"
      status: "pending-external-users"
      result: "At least one clean-machine community installation and one real host end-to-end capture remain required before production-readiness claims."


current_milestone:
  id: "M8"
  name: "public-skill-community-preview"
  display_name: "脱敏的 Skill-first 社区预览版"
  status: "completed"
  started_at: "2026-08-24"
  completed_at: "2026-08-25"
  release_candidate: "1.3.2"
  objective: "把经过技术验证的本地视频知识采集核心整理成可公开审阅、非商业共享、由一个 canonical Agent Skill 驱动的 GitHub 社区发行候选。"
  success_definition:
    - "仓库级 skills/video-knowledge-capture 是 Codex、Claude Code、Hermes 和兼容 Agent Skills 宿主的唯一 Skill 事实源。"
    - "Codex、Claude Code、Hermes 和自定义 Skill 目录都有可重复、精确同步、拒绝符号链接的本地安装路径。"
    - "公开仓库不包含个人知识库路径、用户目录、真实分享标识、进程 ID、凭据或账户材料。"
    - "LICENSE 使用标准 PolyForm Noncommercial 1.0.0；README 明确标记 source-available 而不是 OSI open source。"
    - "商业授权、CLA、贡献规则、第三方许可证和品牌边界均有独立文件。"
    - "Windows CI 执行离线测试和公共发行审计；全新检出无需个人配置即可通过离线验证。"
    - "SECURITY.md 明确威胁模型、安全不变量、报告范围、已知限制和私密披露方式。"
    - "只有在维护者明确授权后才创建公开远端并推送；GitHub Release 和额外仓库设置仍需单独授权。"
  technical_approach:
    canonical_skill: "One standards-oriented SKILL.md with OpenAI metadata, host setup reference, and a bounded loopback Node client; Hermes adds a thin structured-tool plugin without duplicating the Skill."
    local_engine: "Node.js 20+ loopback service remains the single downloader, ASR orchestrator, dedupe/retry ledger, retained-media manager, and Obsidian writer."
    licensing: "Source-available community distribution under PolyForm Noncommercial 1.0.0 plus separate commercial licensing and a contributor license agreement."
    privacy: "Public fixtures and documentation use generic paths and synthetic identifiers; machine-specific acceptance evidence is not publication material."
    validation: "Offline Node tests, Skill validation, temporary install roots, temporary Inbox, and a publication-content audit; live platform checks remain optional and separately authorized."
  acceptance_evidence:
    - id: "m8-canonical-skill"
      status: "verified"
      command: "python quick_validate.py skills/video-knowledge-capture"
      result: "Canonical Skill frontmatter and structure passed the Skill validator on 2026-08-24."
    - id: "m8-agent-installers"
      status: "verified"
      command: "npm.cmd run verify:public-release"
      result: "Codex, Claude Code, custom-directory and Hermes exact-sync behavior passed within the 92-test public-release suite on 2026-08-24."
    - id: "m8-license-and-community-files"
      status: "verified"
      result: "LICENSE, COMMERCIAL_LICENSE.md, CLA.md, CONTRIBUTING.md, THIRD_PARTY_NOTICES.md and TRADEMARKS.md were added from the confirmed noncommercial dual-licensing direction."
    - id: "m8-deidentification"
      status: "verified"
      command: "npm.cmd run audit:public-release"
      result: "The publication audit scanned 89 files and found no forbidden personal path, real share identifier, PID, credential material, generated Python cache or duplicated Skill source on 2026-08-25."
    - id: "m8-windows-ci"
      status: "verified"
      command: "gh run view 32861621767 --repo leonwang2mini-beep/video-knowledge-capture"
      result: "The first public push passed both Windows latest jobs for Node.js 20 and 24, including offline tests and the public-release audit, on 2026-08-25."
    - id: "m8-security-policy"
      status: "verified"
      command: "py -3 resolve_security_md.py --repo . --scope . --out -"
      result: "The maintainer approved the exact root policy; SECURITY.md is the only applicable policy and resolves without conflict on 2026-08-25."
    - id: "m8-clean-checkout"
      status: "verified"
      command: "git clone --local --no-hardlinks . <temporary-directory> && npm.cmd run verify:public-release"
      result: "An independent main checkout was clean before and after validation; all 92 tests, the 89-file public audit and canonical Skill validation passed on 2026-08-25."
    - id: "m8-local-release-suite"
      status: "verified"
      command: "npm.cmd run verify:public-release"
      result: "All 92 offline tests passed and the 89-file public audit passed on Windows on 2026-08-25."
    - id: "m8-hermes-integration"
      status: "verified"
      command: "npm.cmd run verify:hermes"
      result: "The temporary Hermes installation discovered two tools, exercised terminal result mappings, wrote one temporary note, and did not touch a real Obsidian Vault."
    - id: "m8-public-repository"
      status: "verified"
      command: "gh repo view leonwang2mini-beep/video-knowledge-capture"
      result: "The authorized public repository uses main as its default branch and the remote commit matched the locally verified commit after the first push on 2026-08-25."


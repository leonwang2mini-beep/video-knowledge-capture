name: Bug report
description: Report a reproducible problem without sharing credentials or private media.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Do not include cookies, tokens, private links, personal Vault paths, media, or raw downloader output. Generate a report with `node scripts/doctor.mjs --shareable --host <host>`, then review it before posting."
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: "1.4.0-beta.1"
    validations:
      required: true
  - type: dropdown
    id: entrypoint
    attributes:
      label: Entry point
      options:
        - Codex Skill
        - Claude Code Skill
        - Hermes Skill
        - OpenClaw Skill
        - Other Agent Skills host
        - Local web interface
        - CLI
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction with de-identified data
      description: Use example.com or a synthetic fixture instead of a real link.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and actual result
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Reviewed shareable doctor report
      description: Paste only output from doctor:shareable after checking it contains no private material. This is optional when the command cannot run.
      render: json
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed credentials, personal paths, private media, and live share identifiers.
          required: true

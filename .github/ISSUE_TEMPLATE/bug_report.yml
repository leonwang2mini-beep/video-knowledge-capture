name: Bug report
description: Report a reproducible problem without sharing credentials or private media.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Do not include cookies, tokens, private links, personal Vault paths, media, or raw downloader output."
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: "1.3.2"
    validations:
      required: true
  - type: dropdown
    id: entrypoint
    attributes:
      label: Entry point
      options:
        - Codex Skill
        - Claude Code Skill
        - Hermes Skill
        - Local web interface
        - CLI
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction with de-identified data
      description: Use example.com or a synthetic fixture instead of a real link.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and actual result
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed credentials, personal paths, private media, and live share identifiers.
          required: true
